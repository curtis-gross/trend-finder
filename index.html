<!DOCTYPE html>
<html lang="en">

<head>
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('app-theme-v1');
        const theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.backgroundColor = theme === 'dark' ? '#020F1D' : '#FAF8F5';
      } catch (e) {}
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>test-company | Trend Intelligence</title>
  <meta name="description" content="Trend Intelligence and Deep Media Listening platform for test-company — cross-channel sentiment tracking, anomaly alerts, and strategic insight audits." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23FAF8F5%22%20stroke%3D%22%230072BC%22%20stroke-width%3D%222%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2241%22%20text-anchor%3D%22middle%22%20font-family%3D%22Inter%2Csystem-ui%2Csans-serif%22%20font-weight%3D%22700%22%20font-size%3D%2226%22%20letter-spacing%3D%221%22%20fill%3D%22%23041E3A%22%3ETC%3C%2Ftext%3E%3C%2Fsvg%3E" />
  <script>
    (function () {
      const origWarn = console.warn;
      console.warn = function (...args) {
        if (typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com should not be used in production')) {
          return;
        }
        origWarn.apply(console, args);
      };
    })();
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          fontFamily: {
            'studio-sans': ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          opacity: {
            '8': '0.08',
            '12': '0.12',
            '15': '0.15',
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="bg-[var(--app-canvas)] text-[var(--app-text)] antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
